name: publish-portable

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Signed FutureDevGuys/homelab tag (portable-vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'FutureDevGuys/compose-apps' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate immutable release identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = main
          test "$(gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          [[ "$SOURCE_TAG" =~ ^portable-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $SOURCE_TAG" >&2
            exit 1
          fi
          if gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $SOURCE_TAG" >&2
            exit 1
          fi
          echo "version=${SOURCE_TAG#portable-}" >> "$GITHUB_OUTPUT"

      - name: Mint source-read token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.HOMELAB_SOURCE_APP_ID }}
          private-key: ${{ secrets.HOMELAB_SOURCE_APP_PRIVATE_KEY }}
          owner: FutureDevGuys
          repositories: homelab
          permission-contents: read

      - name: Verify signed source tag
        id: source
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/FutureDevGuys/homelab/git/ref/tags/$SOURCE_TAG")"
          test "$(jq -r '.object.type' <<<"$ref")" = tag
          tag_object="$(jq -r '.object.sha' <<<"$ref")"
          tag="$(gh api "repos/FutureDevGuys/homelab/git/tags/$tag_object")"
          test "$(jq -r '.tag' <<<"$tag")" = "$SOURCE_TAG"
          test "$(jq -r '.verification.verified' <<<"$tag")" = true
          test "$(jq -r '.object.type' <<<"$tag")" = commit
          commit="$(jq -r '.object.sha' <<<"$tag")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out exact shelf policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove exact shelf policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Check out exact portable source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: FutureDevGuys/homelab
          ref: ${{ inputs.source_tag }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source
          sparse-checkout: |
            /portable/
            /scripts/export_portable.py
          sparse-checkout-cone-mode: false

      - name: Build and validate deterministic release assets
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 source/scripts/export_portable.py \
            --version "$VERSION" \
            --output dist
          python3 source/scripts/export_portable.py \
            --version "$VERSION" \
            --output dist-repeat
          diff -qr dist dist-repeat
          python3 scripts/validate_release_assets.py \
            --directory dist \
            --version "$VERSION" \
            --source-repo FutureDevGuys/homelab \
            --source-tag "$SOURCE_TAG" \
            --source-commit "$SOURCE_COMMIT"

      - name: Validate clean archive extractions
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir extract-tar extract-zip
          tar -xzf "dist/compose-apps-$VERSION.tar.gz" -C extract-tar
          unzip -q "dist/compose-apps-$VERSION.zip" -d extract-zip
          for extraction in extract-tar extract-zip; do
            count=0
            for app in "$extraction/compose-apps-$VERSION"/apps/*; do
              test -f "$app/compose.yaml"
              test -f "$app/compose.local.yaml"
              docker compose \
                --project-directory "$app" \
                -f "$app/compose.yaml" \
                -f "$app/compose.local.yaml" \
                config >/dev/null
              count=$((count + 1))
            done
            test "$count" -gt 0
          done

      - name: Transfer only canonical release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-release-assets
          path: |
            dist/compose-apps-${{ steps.identity.outputs.version }}.tar.gz
            dist/compose-apps-${{ steps.identity.outputs.version }}.zip
            dist/compose-apps-${{ steps.identity.outputs.version }}.manifest.json
            dist/compose-apps-${{ steps.identity.outputs.version }}.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  publish:
    needs: build
    if: >-
      needs.build.result == 'success' &&
      github.repository == 'FutureDevGuys/compose-apps' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-assets
          path: dist
          digest-mismatch: error

      - name: Revalidate artifact-only publication boundary
        env:
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          expected_assets=(
            "SHA256SUMS"
            "compose-apps-$VERSION.manifest.json"
            "compose-apps-$VERSION.spdx.json"
            "compose-apps-$VERSION.tar.gz"
            "compose-apps-$VERSION.zip"
          )
          mapfile -t actual_assets < <(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          test "${#actual_assets[@]}" -eq "${#expected_assets[@]}"
          for index in "${!expected_assets[@]}"; do
            test "${actual_assets[$index]}" = "${expected_assets[$index]}"
            test -f "dist/${expected_assets[$index]}"
            test ! -L "dist/${expected_assets[$index]}"
          done
          expected_payloads=(
            "compose-apps-$VERSION.manifest.json"
            "compose-apps-$VERSION.spdx.json"
            "compose-apps-$VERSION.tar.gz"
            "compose-apps-$VERSION.zip"
          )
          mapfile -t checksum_assets < <(awk '{print $2}' dist/SHA256SUMS | LC_ALL=C sort)
          test "${#checksum_assets[@]}" -eq "${#expected_payloads[@]}"
          for index in "${!expected_payloads[@]}"; do
            test "${checksum_assets[$index]}" = "${expected_payloads[$index]}"
          done
          (cd dist && sha256sum --check --strict SHA256SUMS)
          jq -e \
            --arg version "$VERSION" \
            --arg repository FutureDevGuys/homelab \
            --arg tag "$SOURCE_TAG" \
            --arg commit "$SOURCE_COMMIT" \
            '.schema == "compose-apps-release-manifest-v1" and
             .version == $version and
             .source == {repository: $repository, tag: $tag, commit: $commit} and
             (.files | type == "array" and length > 0)' \
            "dist/compose-apps-$VERSION.manifest.json" >/dev/null
          jq -e \
            --arg name "compose-apps-$VERSION" \
            '.SPDXID == "SPDXRef-DOCUMENT" and
             .spdxVersion == "SPDX-2.3" and
             .name == $name and
             (.files | type == "array" and length > 0)' \
            "dist/compose-apps-$VERSION.spdx.json" >/dev/null

      - name: Revalidate immutable shelf identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = main
          test "$(gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          if gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $SOURCE_TAG" >&2
            exit 1
          fi
          if gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $SOURCE_TAG" >&2
            exit 1
          fi

      - name: Attest every canonical release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/compose-apps-${{ needs.build.outputs.version }}.tar.gz
            dist/compose-apps-${{ needs.build.outputs.version }}.zip
            dist/compose-apps-${{ needs.build.outputs.version }}.manifest.json
            dist/compose-apps-${{ needs.build.outputs.version }}.spdx.json
            dist/SHA256SUMS

      - name: Reserve exact shelf tag without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          created_ref="$(
            gh api --header "X-GitHub-Api-Version: 2026-03-10" \
              --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref="refs/tags/$SOURCE_TAG" \
              --raw-field sha="$GITHUB_SHA"
          )"
          jq -e \
            --arg ref "refs/tags/$SOURCE_TAG" \
            --arg commit "$GITHUB_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $commit' \
            <<<"$created_ref" >/dev/null
          observed_ref="$(gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG")"
          jq -e \
            --arg ref "refs/tags/$SOURCE_TAG" \
            --arg commit "$GITHUB_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $commit' \
            <<<"$observed_ref" >/dev/null

      - name: Publish only after independent download equality
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "dist/compose-apps-$VERSION.tar.gz"
            "dist/compose-apps-$VERSION.zip"
            "dist/compose-apps-$VERSION.manifest.json"
            "dist/compose-apps-$VERSION.spdx.json"
            "dist/SHA256SUMS"
          )
          gh release create "$SOURCE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$SOURCE_TAG" \
            --notes "Portable artifacts from signed FutureDevGuys/homelab@$SOURCE_TAG ($SOURCE_COMMIT)."
          mkdir downloaded
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir downloaded
          mapfile -t downloaded_assets < <(find downloaded -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          expected_assets=(
            "SHA256SUMS"
            "compose-apps-$VERSION.manifest.json"
            "compose-apps-$VERSION.spdx.json"
            "compose-apps-$VERSION.tar.gz"
            "compose-apps-$VERSION.zip"
          )
          test "${#downloaded_assets[@]}" -eq "${#expected_assets[@]}"
          for index in "${!expected_assets[@]}"; do
            test "${downloaded_assets[$index]}" = "${expected_assets[$index]}"
          done
          diff -qr dist downloaded
          tag_ref="$(gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG")"
          jq -e \
            --arg commit "$GITHUB_SHA" \
            '.object.type == "commit" and .object.sha == $commit' \
            <<<"$tag_ref" >/dev/null
          gh release edit "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft=false \
            --latest=false

      - name: Verify published immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "dist/compose-apps-$VERSION.tar.gz"
            "dist/compose-apps-$VERSION.zip"
            "dist/compose-apps-$VERSION.manifest.json"
            "dist/compose-apps-$VERSION.spdx.json"
            "dist/SHA256SUMS"
          )
          tag_ref="$(gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG")"
          jq -e \
            --arg ref "refs/tags/$SOURCE_TAG" \
            --arg commit "$GITHUB_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $commit' \
            <<<"$tag_ref" >/dev/null
          release="$(gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_TAG")"
          jq -e \
            --arg tag "$SOURCE_TAG" \
            '.tag_name == $tag and
             .name == $tag and
             .draft == false and
             .prerelease == false and
             .immutable == true and
             .published_at != null' \
            <<<"$release" >/dev/null
          expected_assets="$({
            for asset in "${assets[@]}"; do
              name="${asset#dist/}"
              size="$(stat --format=%s "$asset")"
              digest="$(sha256sum "$asset" | cut -d ' ' -f 1)"
              jq -cn \
                --arg name "$name" \
                --arg state uploaded \
                --arg digest "sha256:$digest" \
                --argjson size "$size" \
                '{name: $name, state: $state, size: $size, digest: $digest}'
            done
          } | jq -sc 'sort_by(.name)')"
          published_assets="$(
            jq -c '[.assets[] | {name, state, size, digest}] | sort_by(.name)' <<<"$release"
          )"
          test "$published_assets" = "$expected_assets"
          mkdir published-download
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published-download
          mapfile -t downloaded_assets < <(
            find published-download -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t expected_names < <(
            printf '%s\n' "${assets[@]#dist/}" | LC_ALL=C sort
          )
          test "${#downloaded_assets[@]}" -eq "${#expected_names[@]}"
          for index in "${!expected_names[@]}"; do
            test "${downloaded_assets[$index]}" = "${expected_names[$index]}"
          done
          diff -qr dist published-download
          jq -e \
            --arg version "$VERSION" \
            --arg repository FutureDevGuys/homelab \
            --arg tag "$SOURCE_TAG" \
            --arg commit "$SOURCE_COMMIT" \
            '.schema == "compose-apps-release-manifest-v1" and
             .version == $version and
             .source == {repository: $repository, tag: $tag, commit: $commit}' \
            "published-download/compose-apps-$VERSION.manifest.json" >/dev/null
          final_ref="$(gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG")"
          jq -e \
            --arg commit "$GITHUB_SHA" \
            '.object.type == "commit" and .object.sha == $commit' \
            <<<"$final_ref" >/dev/null
